# Internal routing proxy. The host nginx (certbot, TLS) forwards to this on 127.0.0.1:${PORT}.
upstream backend  { server backend:8080; }
upstream frontend { server frontend:8080; }

# Docker network subnet (pinned in docker-compose.yaml); trust X-Forwarded-For from the host nginx.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Pass the scheme the browser used (set by the host nginx) through to the backend.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    error_log /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Connection        "";

    # tus uploads: one chunk per request (default 32 MiB). Do not buffer to disk.
    location /files/ {
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://backend;
    }

    location /api/ {
        client_max_body_size 1m;
        proxy_read_timeout 60s;
        proxy_pass http://backend;
    }

    location / {
        client_max_body_size 1k;
        proxy_pass http://frontend;
    }
}
