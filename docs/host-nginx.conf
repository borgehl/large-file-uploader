# Host (bare-metal) nginx server block for the Large File Uploader.
# TLS is issued and renewed by certbot:
#   sudo certbot --nginx -d upload.example.com
# certbot adds the ssl_certificate lines and the :80 -> :443 redirect; keep the rest as below.
#
# The compose stack listens on 127.0.0.1:${PORT} (default 8081) and is never exposed directly.
# Validate with: sudo nginx -t

server {
    listen 443 ssl;
    server_name upload.example.com;

    # --- managed by certbot -------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/upload.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/upload.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # -----------------------------------------------------------------------

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Per request size (one 32 MiB upload chunk), NOT the file size limit.
    client_max_body_size 64m;

    # There are two proxies in the path (this one and the compose nginx).
    # Both must stream request bodies, otherwise every chunk is spooled to disk twice.
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_http_version      1.1;
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;

    location / {
        proxy_pass http://127.0.0.1:8081;   # = PORT in .env
        proxy_set_header Host              $host;
        # Overwrite (never append) so a client cannot spoof its address.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name upload.example.com;
    return 301 https://$host$request_uri;
}
